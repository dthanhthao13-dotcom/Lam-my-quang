<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đầu Bếp Tí Hon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}

/* Layout: one 3:2 game canvas centred on a warm dark kitchen-wood ground; everything is drawn inside it. */
:root{
  --ground:#2a1609; --frame:#5a2e12; --accent:#e8601c; --text:#ffe9c7; --muted:#d6a774;
  --ui:'Baloo 2', 'Nunito', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{
  margin:0; background:var(--ground); color:var(--text); font-family:var(--ui);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  box-sizing:border-box; min-height:100vh; min-height:100dvh;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.stage{
  width:min(100%, 1200px, calc((100vh - 70px) * 1.5));
  width:min(100%, 1200px, calc((100dvh - 70px) * 1.5));
  max-width:100%; aspect-ratio:3/2; border-radius:10px; overflow:hidden;
  box-shadow:0 0 0 3px var(--frame), 0 0 0 6px var(--accent), 0 18px 40px rgba(0,0,0,.45);
}
canvas{display:block; width:100%; height:100%; touch-action:none; outline:none}
canvas:focus-visible{box-shadow:inset 0 0 0 4px #ffd36e}
.note{margin:0; font-size:15px; color:var(--muted); text-align:center; letter-spacing:.02em; text-wrap:balance}
</style>

</head>
<body>
<div class="stage"><canvas id="game" width="960" height="640" tabindex="0" aria-label="Trò chơi Đầu Bếp Tí Hon: vào vai đầu bếp, kéo thả và thao tác để nấu mì Quảng qua 7 màn"></canvas></div>
<p class="note">Kéo, thả, chạm và xoay để nấu · Mở đầu và 7 màn theo quy trình làm mì Quảng</p>

<script>
(() => {
const W = 960, H = 640;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT = '"Baloo 2", "Nunito", system-ui, sans-serif';
const C = { cream:'#fff4dc', cream2:'#ffe6b8', border:'#a8521e', orange:'#e8601c', ink:'#3a1d0c', brown:'#6b3412',
  green:'#43a82a', green2:'#7ed957', red:'#d6402a', gold:'#ffc83a', white:'#ffffff', water:'rgba(150,210,240,.8)' };

const TITLES = ['Đi chợ','Sơ chế nguyên liệu','Làm sợi mì Quảng','Lọc thịt và thái','Ướp và xào nhân','Nấu nước dùng','Bày món vào tô','Hoàn thành'];
const SHORT = ['Mở đầu: Đi chợ','1. Sơ chế','2. Làm sợi mì','3. Thái','4. Ướp, xào nhân','5. Nước dùng','6. Bày tô','7. Hoàn thành'];
const FACTS = [
  'Mì Quảng là đặc sản Quảng Nam – Đà Nẵng. Đi chợ mua gạo, gà nguyên con, tôm, trứng, rau sống, các loại hành, tỏi, nghệ, ớt và bánh tráng mè.',
  'Rau sống phải rửa kỹ dưới vòi nước. Tôm bóc vỏ, bỏ đầu trước khi nấu. Rửa xong nhớ khoá vòi để tiết kiệm nước.',
  'Gạo ngâm mềm được xay thành bột nước, tráng mỏng trên nồi hấp rồi cắt thành sợi to bản. Quét chút dầu để sợi không dính.',
  'Lọc thịt gà: đùi và ức làm nhân, còn chân, cánh, khung xương để hầm nước dùng cho ngọt. Không bỏ phí phần nào!',
  'Ướp gà, tôm với hành, tỏi, nghệ, nước mắm cho thấm. Phi dầu cho nóng rồi xào trên lửa vừa đến khi nhân săn lại, vàng thơm.',
  'Hầm xương gà cho nước ngọt, hớt bọt cho nước trong, thêm hành, nêm nếm rồi đổ nhân vào. Rim nhỏ lửa giúp nước sánh lại, ngấm vào nhân: bí quyết để mì Quảng ít nước mà vẫn đậm đà.',
  'Bày tô theo thứ tự: rau sống, sợi mì, nhân, trứng, rồi chan nước dùng xâm xấp mặt mì.',
  'Khi ăn, rắc đậu phộng, vắt chanh, thêm ớt, bẻ bánh tráng và trộn đều. Chúc ngon miệng!'
];

/* ---------- assets ---------- */
const ASSETS = ('title chuanbi intro1 intro2 intro3 intro4 intro5 to0 to1 to2 to3 to4 final bg_bonrua bg_bep bg_thot bg_ban '+
 'ba_point ba_cheer ba_stop tom_song tom_boc bat_bot soi_trang ro_rau hanh_tay hanh_la chao '+
 'dau_phong_gia hanh_la_thai chanh hanh_tim toi trung ot nghe ro_gao gao_ngam coi ga_song ga_thai ga_mieng to_rong '+
 'tay_cham tay_cam tay_dao tay_dua tay_xeng tay_va tay_xoe_r tay_rau tay_ca '+
 'ga_nghieng nuoc_hanh nhan_food gk_canhT gk_canhP gk_duiT gk_duiP gk_than gk_thanL gk_thanR gk_khung ghinho ds cuon ga_me ga_banh uc_to dui_ga canh_ga uc_nho chan_ga nhan_song va_nhan gio coi_base noi_hap banh_lop chao_trong chao_nhan noi0 noi1 noi2 noi3 me_ga bot vot_sach vot_day va_day va_rot lua1 lua2 lua3 '+
 'to_nhan r_ga1 r_ga2 r_ga3 r_tom1 lop_htim lop_htay tl1 tl2 tl4 me_giavi pot0 pot_hanh pot_nhan chau_trong chau_nuoc noi_ga p_ga3 p_tom3 noi_hanh noi_nhan thau thung_rac chan1 chan2 chan3 chan4 final_clean khay_trung p_tom1 p_ga1 p_ga2 p_ht1 p_ht2 p_htim final2 dua_doi ro_vo_tom bt_doi bt_manh bt_vun2 chanh_vat hanh_tay_thai hanh_thai3 ga_chin tom_chin1 tom_chin2 '+
 'tom_tay1 tom_tay2 tom_tay3 tom_bo_dau tom_boc_song dau_tom vo_tom ga_song2 ga_thai2 hanh_nguyen hanh_thai2 chen_hanh chen_nghe chen_toi dau_an bt_tay1 bt_tay2 bt_ro bt_vun ot_lat '+
 'muoi_lo hatnem_lo duong_lo cho bep_xao coi_trong to_uop banh_uot trung_vo trung_boc trung_cat bep1 bep2 bep3 gio nuoc_mam dau_phong banh_trang_nuong ro_gia xa_lach ngo2 hanh_tim2 '+
 'sua_hop ly_sua pho_mai bi_do nam hoa hoa_sen chuoi tao cam nho_qua dau_tay viet_quat xoai thanh_long dua_hau ca_chua ca_rot').split(' ');
const IMG = {}; let loaded = 0;
ASSETS.forEach(n => { const im = new Image(); im.onload = im.onerror = () => loaded++; im.src = 'a/' + n + '.webp'; IMG[n] = im; });
const ready = n => IMG[n] && (IMG[n].tagName==='CANVAS' || (IMG[n].complete && IMG[n].naturalWidth > 0));
const sh = (n,w) => ready(n) ? w*(IMG[n].naturalHeight||IMG[n].height)/(IMG[n].naturalWidth||IMG[n].width) : w*.7;
function spr(n,x,y,w,o){
  if(!ready(n)) return; o = o||{}; const h = sh(n,w);
  ctx.save(); if(o.alpha!=null) ctx.globalAlpha *= o.alpha; ctx.translate(x,y); if(o.rot) ctx.rotate(o.rot);
  ctx.drawImage(IMG[n], -(o.ax??.5)*w, -(o.ay??.5)*h, w, h); ctx.restore();
}

/* ---------- canvas sizing ---------- */
function fit(){ const r = cv.getBoundingClientRect(); if(!r.width) return;
  const px = Math.round(r.width*(window.devicePixelRatio||1)); const w = Math.min(2400, Math.max(480, px));
  if(cv.width !== w){ cv.width = w; cv.height = Math.round(w*2/3); } }
new ResizeObserver(fit).observe(cv); fit();

/* ---------- draw helpers ---------- */
const font = (s,wt) => (wt||700)+' '+s+'px '+FONT;
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function panel(x,y,w,h,r,fill,line,lw){ rr(x,y,w,h,r); ctx.fillStyle=fill; ctx.fill(); if(line){ ctx.lineWidth=lw||3; ctx.strokeStyle=line; ctx.stroke(); } }
function T(s,x,y,size,col,al,wt){ ctx.font=font(size,wt); ctx.fillStyle=col||C.ink; ctx.textAlign=al||'left'; ctx.textBaseline='alphabetic'; ctx.fillText(s,x,y); }
function TS(s,x,y,size,col,al,wt,sc){ ctx.save(); ctx.font=font(size,wt); ctx.textAlign=al||'left'; ctx.lineJoin='round'; ctx.lineWidth=Math.max(3,size/6); ctx.strokeStyle=sc||C.ink; ctx.strokeText(s,x,y); ctx.fillStyle=col; ctx.fillText(s,x,y); ctx.restore(); }
function wrap(s,maxW,size,wt){ ctx.font=font(size,wt); const words=s.split(' '), out=[]; let ln='';
  for(const w of words){ const t=ln?ln+' '+w:w; if(ctx.measureText(t).width>maxW && ln){ out.push(ln); ln=w; } else ln=t; } if(ln) out.push(ln); return out; }
function ell(cx,cy,rx,ry,fill){ ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
function shadow(x,y,rx,ry){ ell(x,y,rx,ry,'rgba(60,25,5,.22)'); }
function star(cx,cy,r,on){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rad=i%2?r*.48:r; ctx.lineTo(cx+Math.cos(a)*rad, cy+Math.sin(a)*rad); } ctx.closePath();
  ctx.fillStyle=on?C.gold:'#e6d3b0'; ctx.fill(); ctx.lineWidth=3; ctx.strokeStyle=on?'#a85a0a':'#bfa680'; ctx.stroke(); }
function tag(s,x,y){ ctx.font=font(15,700); const w=ctx.measureText(s).width+16; panel(x-w/2,y-12,w,22,11,'rgba(58,29,12,.86)'); T(s,x,y+4,15,C.cream,'center'); }
function tintEll(cx,cy,rx,ry,col,a){ if(a<=0) return; ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.clip();
  ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=a; ctx.fillStyle=col; ctx.fillRect(cx-rx,cy-ry,rx*2,ry*2); ctx.restore(); }
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), rand=(a,b)=>a+Math.random()*(b-a);
function mix(c1,c2,t){ t=clamp(t,0,1); const a=parseInt(c1.slice(1),16), b=parseInt(c2.slice(1),16);
  const r=Math.round(lerp(a>>16,b>>16,t)), g=Math.round(lerp((a>>8)&255,(b>>8)&255,t)), bl=Math.round(lerp(a&255,b&255,t));
  return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1); }
function flames(x0,x1,y,k){ if(k<=0) return; for(let x=x0;x<=x1;x+=13){ const h=(16+9*Math.sin(G.t*15+x*.9))*k;
  ell(x,y,6,4,'rgba(70,130,255,.9)'); ell(x,y-h/2,6.5,h/2,'rgba(255,128,24,.92)'); ell(x,y-h/3,3.5,h/3,'rgba(255,224,90,.95)'); } }
function foam(x,y){ [[0,0,10],[-11,3,7],[11,2,8],[-4,-6,6],[6,-5,6]].forEach(([a,b,r])=>{ ell(x+a,y+b,r+1.5,r*.8+1.5,'rgba(150,120,80,.5)'); ell(x+a,y+b,r,r*.8,'#fffaf0'); }); }

function gasFlame(x,y,w,k){ if(!k) return; const i=1+((G.t*12)|0)%3, n='lua'+i; if(!ready(n)) return;
  const h=sh(n,w)*(1+.12*Math.sin(G.t*23)+.06*Math.sin(G.t*37)); ctx.save(); ctx.globalAlpha=Math.min(1,k)*(.82+.18*Math.sin(G.t*17)); ctx.globalCompositeOperation='lighter';
  ctx.drawImage(IMG[n],x-w/2,y-h*.85,w,h); ctx.restore(); }
function gasGlow(heat){ const t=G.t; ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let x=300;x<=670;x+=22){ const h=(12+8*Math.sin(t*16+x*.7))*(.6+heat); ctx.globalAlpha=.35+.25*Math.sin(t*20+x);
    ell(x,612-h/2,9,h/2,'rgb(255,120,20)'); ell(x,612-h/3,4,h/3,'rgb(255,220,90)'); } ctx.restore(); }
function flash(img,x,y,w){ G.flash={img,x,y,w,t:0}; }
function fly(img,x0,y0,x1,y1,w,cb){ (G.fly=G.fly||[]).push({img,x0,y0,x1,y1,w,cb,t:0}); }
function broth(k,ripple){ if(k<=0) return; ctx.save(); ctx.beginPath(); ctx.ellipse(485,412,176,82,0,0,Math.PI*2); ctx.clip();
  const rx=95+81*k, ry=36+44*k, y=448-36*k; ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=.5+k*.4; ell(485,y,rx,ry,'#e39a3c'); ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=.35*k; ctx.strokeStyle='#f0b050'; ctx.lineWidth=10; ctx.beginPath(); ctx.ellipse(485,y,rx-6,ry-5,0,0,Math.PI*2); ctx.stroke();
  if(ripple){ ctx.globalAlpha=.7; for(let r=0;r<2;r++){ const ph=(G.t*1.5+r/2)%1; ctx.strokeStyle=`rgba(255,235,180,${1-ph})`; ctx.lineWidth=2.5; ctx.beginPath(); ctx.ellipse(488,y-6,10+ph*rx*.6,4+ph*ry*.5,0,0,Math.PI*2); ctx.stroke(); } }
  ctx.restore(); }
function plate(x,y,w){ const rx=w/2, ry=w*.2; ell(x,y+5,rx+3,ry+3,'rgba(60,25,5,.28)'); ell(x,y,rx,ry,'#2f5e9e'); ell(x,y-1,rx-3,ry-2,'#fbfaf6');
  ctx.save(); ctx.strokeStyle='#3d72b8'; ctx.lineWidth=2.5; ctx.setLineDash([7,5]); ctx.beginPath(); ctx.ellipse(x,y-1,rx-9,ry-6,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
  ell(x,y+1,rx*.7,ry*.62,'#eceae2'); ell(x-rx*.2,y-ry*.25,rx*.25,ry*.15,'rgba(255,255,255,.7)'); }
/* ---------- composite drawers ---------- */
function nhanWok(x,y,w,cook){
  spr('chao',x,y,w); const h=sh('chao',w), cx=x, cy=y-h*.12, rx=w*.34, ry=h*.22;
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.clip();
  [[-.17,.02,.17],[.06,.06,.17],[.2,-.03,.15],[-.02,-.07,.14]].forEach(([a,b,s])=>spr('ga_mieng',cx+a*w,cy+b*w,s*w));
  [[-.08,-.01,.2],[.13,.02,.19]].forEach(([a,b,s])=>spr('tom_boc',cx+a*w,cy+b*w,s*w));
  ctx.restore(); tintEll(cx,cy,rx,ry,mix('#f7cf55','#dd8a2a',cook),.55+cook*.25);
}
function bowlFill(it,L){
  const w=it.w, h=sh('to_rong',w), cx=it.x, cy=it.y-h*.17, rx=w*.43, ry=h*.22, b=L.f.bowl||{};
  if(!Object.keys(b).length) return;
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2); ctx.clip(); const r=(L.f.mix||0)*5;
  const P=(a,d)=>[cx+Math.cos(a+r)*d*rx, cy+Math.sin(a+r)*d*ry];
  if(b.ga){ spr('ga_thai2',cx-rx*.42,cy-ry*.05,w*.5,{rot:-.15+r*.05}); spr('ga_thai2',cx+rx*.38,cy+ry*.1,w*.48,{rot:.3+r*.05}); spr('ga_thai2',cx,cy-ry*.35,w*.44,{rot:1.4}); }
  if(b.tom){ spr('tom_boc_song',cx+rx*.05,cy+ry*.15,w*.5,{rot:r*.05}); spr('tom_boc_song',cx-rx*.35,cy+ry*.4,w*.38,{rot:.4}); spr('tom_boc_song',cx+rx*.45,cy-ry*.3,w*.36,{rot:-.5}); }
  if(b.hanh_tim) for(let i=0;i<14;i++){ const [x,y]=P(i*.9,.2+(i%4)*.18); ell(x,y,4,3,'#a5507f'); }
  if(b.toi) for(let i=0;i<12;i++){ const [x,y]=P(i*1.1+.4,.15+(i%3)*.25); ell(x,y,3.5,3,'#f6eedc'); }
  ctx.restore();
  if(b.nuoc_mam) tintEll(cx,cy,rx,ry,'#c98a52',.25);
  if(b.nghe) tintEll(cx,cy,rx,ry,'#f2b51c',.35+(L.f.mix||0)*.35);
}

/* ---------- game state ---------- */
const G = { scene:'loading', lvl:0, mistakes:[0,0,0,0,0,0,0,0], level:null, toasts:[], parts:[],
  ptr:{x:480,y:320,down:false,inside:false}, mouse:false, drag:null, stir:null, sw:null, sound:true, t:0, card:null, btns:[], shake:0, face:'ba_point', faceT:0 };
const cur = L => L.steps[L.si];
const SCENE_BG = new Set(['to_nhan','noi_hanh','noi_nhan','final_clean','final2','chuanbi','to0','to1','to2','to3','to4','final','bep_xao','noi0','noi1','noi2','noi3']);
const sc = L => SCENE_BG.has(L.bg);
const fitW = (n,mw,mh) => { const r = ready(n)? IMG[n].naturalWidth/IMG[n].naturalHeight : 1.3; return Math.min(mw, mh*r); };
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function mk(id,img,x,y,w,o){ return Object.assign({id,img,x,y,hx:x,hy:y,w,vis:true,lock:0,label:''},o||{}); }
const itm = (L,id) => L.items.find(i=>i.id===id);
function inZ(z,p){ if(!z) return false;
  if(z.rx!=null){ const dx=(p.x-z.x)/z.rx, dy=(p.y-z.y)/z.ry; return dx*dx+dy*dy<=1; }
  if(z.r!=null) return Math.hypot(p.x-z.x,p.y-z.y)<=z.r;
  return p.x>=z.x && p.x<=z.x+z.w && p.y>=z.y && p.y<=z.y+z.h; }
const zc = z => z.w!=null ? {x:z.x+z.w/2, y:z.y+z.h/2} : {x:z.x,y:z.y};
function itemBox(it){ if(it.ghost) return it.hit; if(it.anchor&&G.drag?.it!==it){ const h=sh(it.img,it.w); return {x:it.x-it.w*.5,y:it.y-h*.5,w:it.w,h:h}; } const h=sh(it.img,it.w); return {x:it.x-it.w*.42, y:it.y-h*.42, w:it.w*.84, h:h*.84}; }

/* ---------- effects & sound ---------- */
function burst(x,y,cols,n,sz){ n=reduce?Math.ceil(n/3):n; for(let i=0;i<n;i++) G.parts.push({x,y,vx:rand(-130,130),vy:rand(-200,-40),g:420,life:.8,max:.8,c:cols[i%cols.length],s:sz||5}); }
function steam(x,y,spread){ if(reduce&&Math.random()<.6) return; G.parts.push({x:x+rand(-spread,spread),y,vx:rand(-8,8),vy:-rand(30,55),g:0,life:1.6,max:1.6,c:'#ffffff',s:rand(8,16),soft:true}); }
function hearts(x,y){ for(let i=0;i<8;i++) G.parts.push({x:x+rand(-60,60),y:y+rand(-20,20),vx:rand(-20,20),vy:-rand(40,90),g:0,life:1.6,max:1.6,c:'#ff5d7a',s:12,heart:true}); }
function toast(msg,kind){ G.toasts.push({msg,kind,t:0}); while(G.toasts.length>2) G.toasts.shift(); }
function face(n,t){ G.face=n; G.faceT=t||1.4; }
let AC=null;
function audioInit(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); }
function beep(f,d,type,v,when){ if(!AC||!G.sound) return; const t=AC.currentTime+(when||0); const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'triangle'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(v||.07,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }
let NB=null; const LOOPS={}; const LCFG={water:['bandpass',1100,.7,.16],sizzle:['highpass',3200,.7,.1],boil:['lowpass',420,1,.22],grind:['lowpass',180,1,.28]};
function loopGain(name){ if(!AC) return null; if(LOOPS[name]) return LOOPS[name];
  if(!NB){ NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate); const d=NB.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const src=AC.createBufferSource(); src.buffer=NB; src.loop=true; const [type,f,q]=LCFG[name]; const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q;
  const g=AC.createGain(); g.gain.value=0; src.connect(fl); fl.connect(g); g.connect(AC.destination); src.start(); LOOPS[name]=g; return g; }
function updateLoops(){ if(!AC) return; const L=G.level; const want=(G.sound&&G.scene==='play'&&!G.card&&L&&L.snd)?L.snd(L):{};

/* ---------- step flow ---------- */
function mistake(L,msg){ G.mistakes[L.n]++; toast(msg,'bad'); sfx('bad'); face('ba_stop',1.8); if(!reduce) G.shake=.25; }
function startStep(L,i){
  L.adv=0;
  if(i>=L.steps.length){ L.endT=2.2; sfx('win'); burst(480,300,[C.gold,'#ff9a3a',C.cream],36,7); toast(L.n===7?'Tô mì Quảng hoàn hảo!':'Hoàn thành rồi! Cùng ngắm thành quả nào.','good'); return; }
  L.si=i; const s=L.steps[i];
  Object.assign(s,{p:0,done:false,got:new Set(),v:s.v0||0,holding:false,block:false,acc:0,turnK:0,fix:null}); L.stepT=0; G.auto=null;
  if(s.bg) L.bg=s.bg;
  s.onStart&&s.onStart(L);
}
function finish(L,silent){ const s=cur(L); s.done=true; s.onDone&&s.onDone(L); if(!silent) sfx('good'); face('ba_cheer',1.2); L.adv=.65; }
function isLater(L,id){ return L.steps.some((st,j)=>j>L.si&&st.type==='drop'&&st.need.includes(id)); }
function dropItem(it){
  const L=G.level, s=cur(L), p={x:G.ptr.x,y:G.ptr.y}; let zn=null;
  if(L.preDrop&&L.preDrop(L,it,p)) return;
  if(s&&s.type==='skim'&&it.id==='vot'){
    if(L.f.full&&inZ(L.zones.batbo,p)) skimDump(L,it);
    else if(L.f.full) toast('Đổ bọt vào bát bỏ bọt nhé!','info');
    it.ret=true; return; }
  if(s&&s.zone&&inZ(L.zones[s.zone],p)) zn=s.zone;
  else for(const k in L.zones){ if(inZ(L.zones[k],p)){ zn=k; break; } }
  if(zn && s && !s.done && L.adv<=0 && s.type==='drop' && s.zone===zn && s.need.includes(it.id) && !s.got.has(it.id)){
    const msg=s.check&&s.check(L,it); if(msg){ toast(msg,'info'); if(!it.ghost) it.ret=true; return; }
    s.got.add(it.id); if(!it.ghost && !s.keep) it.vis=false; sfx('good'); burst(p.x,p.y,[C.gold,C.cream,'#ff9a3a'],12);
    s.onEach&&s.onEach(L,it); if(s.any||s.got.size>=s.need.length) finish(L,true);
    if(!it.ghost && it.vis) it.ret=true; return;
  }
  if(zn && it.bad && s && s.zone===zn){ mistake(L,it.bad); if(!it.ghost) it.ret=true; return; }
  if(zn){
    if(L.busyMsg) toast(L.busyMsg,'info');
    else if(isLater(L,it.id)) mistake(L,'Chưa đến bước này! Làm theo lời bà nhé.');
    else if(s && s.type==='drop' && s.need.includes(it.id)) toast('Chưa đúng chỗ. Thả vào vùng có viền vàng nhé.','info');
  }
  if(!it.ghost) it.ret=true;
}
function judge(L,s){
  if(s.p>=s.good[0]&&s.p<=s.good[1]) finish(L);
  else if(s.p<s.good[0]){ mistake(L,s.early); s.p=0; } else { mistake(L,s.late); s.p=0; }
}

function drawInfo(L){
  ctx.fillStyle='rgba(30,14,4,.6)'; ctx.fillRect(0,0,W,H);
  panel(70,40,820,560,26,C.cream,C.border,5); panel(82,52,796,536,20,'rgba(0,0,0,0)','#f0b77a',2);

  const paras=['Mì Quảng là món ăn nổi tiếng của Quảng Nam và Đà Nẵng. Người dân nơi đây ăn mì Quảng vào bữa sáng, bữa trưa, trong ngày giỗ, ngày Tết và khi đón khách quý.',
    'Nét riêng của mì Quảng là sợi mì to bản làm từ gạo, nước dùng ít mà đậm đà, chỉ chan xâm xấp. Ăn kèm rau sống, đậu phộng rang, bánh tráng mè nướng giòn, vắt chanh và thêm ớt.',
    'Mỗi nhà có một cách nấu riêng: mì Quảng gà, tôm thịt, cá lóc, ếch... nhưng đều chung một hương vị thân thương.'];
  let y=180; paras.forEach(pa=>{ wrap(pa,560,18,600).forEach(ln=>{ T(ln,300,y,18,C.ink,'left',600); y+=24; }); y+=8; });
  panel(110,y+4,740,78,16,'#ffe2ad',C.orange,2.5);

  button(220,522,250,58,'CHƠI LẠI ↺',()=>{ G.mistakes=[0,0,0,0,0,0,0,0]; G.over={}; startLevel(0); }); button(490,522,250,58,'TRANG ĐẦU',()=>{ G.scene='title'; },['#ffb36b','#e8601c']);
}
function navBtn(x,y,icon,act){ ell(x,y,20,20,'rgba(58,29,12,.85)'); T(icon,x,y+7,20,C.cream,'center',800); G.btns.push({x:x-20,y:y-20,w:40,h:40,act}); }
function drawNav(){ const L=G.level; if(!L) return; const tl=L.ui==='tl'&&!G.card, P=i=>tl?[286+i*46,27]:[930,74+i*44];
  navBtn(...P(0),'↺',()=>{ G.modal={type:'confirm',msg:'Làm lại màn này từ đầu?',act:()=>startLevel(L.n)}; });
  if(L.n>0) navBtn(...P(1),'◀',()=>{ G.modal={type:'confirm',msg:'Quay lại màn trước?',act:()=>startLevel(L.n-1)}; });
  navBtn(...P(L.n>0?2:1),'☰',()=>{ G.modal={type:'select'}; }); }
function drawModal(){ const M=G.modal; G.btns=[]; ctx.fillStyle='rgba(30,14,4,.6)'; ctx.fillRect(0,0,W,H);
  if(M.type==='confirm'){ panel(250,210,460,220,24,C.cream,C.border,4); spr('ba_point',330,300,110); T(M.msg,560,300,24,C.ink,'center',800);
    T('Số lỗi của màn sẽ được tính lại.',560,332,16,C.brown,'center',600);
    button(420,358,140,52,'ĐỒNG Ý',()=>{ const a=M.act; G.modal=null; a(); }); button(580,358,110,52,'HUỶ',()=>{ G.modal=null; },['#ffb36b','#e8601c']); return; }
  panel(210,60,540,520,24,C.cream,C.border,4); TS('CHỌN MÀN',480,112,34,'#ff8a1e','center',800,'#6b2a08');
  SHORT.forEach((t,i)=>{ const x=240+(i%2)*250, y=140+((i/2)|0)*78; panel(x,y,230,62,16,'#ffe9c4',C.orange,2.5); T(t,x+115,y+39,19,C.ink,'center',700);
    G.btns.push({x,y,w:230,h:62,act:()=>{ G.modal=null; G.mistakes[i]=0; startLevel(i); }}); });
  button(290,470,180,52,'TRANG ĐẦU',()=>{ G.modal=null; G.scene='title'; },['#ffb36b','#e8601c']); button(490,470,180,52,'ĐÓNG',()=>{ G.modal=null; }); }
function drawFinal(){
  full('final'); ctx.fillStyle='rgba(30,14,4,.45)'; ctx.fillRect(0,0,W,H);
  panel(250,30,460,600,26,C.cream,C.border,5);
  TS('Đầu bếp tí hon!',480,96,40,'#ff8a1e','center',800,'#6b2a08'); T('Tô mì Quảng của em đã sẵn sàng',480,126,19,C.brown,'center',700);
  let total=0;
  for(let i=0;i<8;i++){ const y=160+i*44, st=stars(i); total+=st; if(i%2===0) panel(274,y-4,412,40,10,'#ffe9c4');
    T(SHORT[i],290,y+23,19,C.ink,'left',700); for(let k=0;k<3;k++) star(590+k*32,y+16,12,k<st); }
  T('Tổng: '+total+' / 24 sao',290,522,22,C.ink,'left',800);
  T(total>=22?'Xuất sắc!':total>=16?'Giỏi lắm!':'Chơi lại nhé!',670,522,20,'#c2410c','right',800);
  const ov=Object.keys(G.over||{}); const nm={muoi:'muối',hatnem:'hạt nêm',duong:'đường phèn',nuocmam:'nước mắm'};
  const cm=ov.length? 'Bà nhận xét: Nước dùng bị '+(ov.some(k=>k!=='duong')?'mặn':'')+(ov.some(k=>k!=='duong')&&ov.includes('duong')?' và ':'')+(ov.includes('duong')?'ngọt quá':'')+' vì nêm thừa '+ov.map(k=>nm[k]).join(', ')+'. Lần sau nhớ nêm mỗi thứ một lần, nếm thử rồi mới thêm nhé!' : 'Bà nhận xét: Nước dùng nêm nếm vừa vị, giỏi lắm!';
  wrap(cm,400,15,700).slice(0,3).forEach((ln,i)=>T(ln,290,538+i*17,15,ov.length?'#b3261e':'#2f7d1f','left',700));
  button(350,592,260,46,'TIẾP TỤC ▶',()=>{ G.scene='info'; G.parts=[]; });
}
function drawPlay(){
  const L=G.level;
  ctx.save(); if(G.shake>0) ctx.translate(rand(-4,4),rand(-4,4));
  if(L.shownBg!==L.bg){ L.fromBg=L.shownBg; L.shownBg=L.bg; L.fadeT=0; }
  full(L.bg); if(L.fromBg&&L.fadeT<.45){ ctx.save(); ctx.globalAlpha=1-L.fadeT/.45; full(L.fromBg); ctx.restore(); }
  L.under&&L.under(L);
  for(const it of L.items){ if(!it.vis||it.ghost||G.drag?.it===it) continue;
    if(L.drawItem&&L.drawItem(L,it)) continue;
    if(it.hand){ spr(it.img,it.x,it.y,it.w); continue; }
    const h=sh(it.img,it.w); if((it.alpha??1)>.6) shadow(it.x,it.y+h*.4,it.w*.4,h*.08);
    if(it.filter){ ctx.save(); ctx.filter=it.filter; spr(it.img,it.x,it.y,it.w,{alpha:it.alpha}); ctx.restore(); } else spr(it.img,it.x,it.y,it.w,{alpha:it.alpha}); }
  L.over&&L.over(L);
  stepUnder(L);
  const s=cur(L);
  for(const it of L.items){ if(G.card||G.drag?.it===it||!it.label) continue; if(!it.vis&&!it.ghost) continue;
    if(it.ghost && !(s&&s.type==='drop'&&s.need.includes(it.id)&&!s.got.has(it.id))) continue;
    const b=itemBox(it); if(L.hoverLabels&&!inZ(b,G.ptr)) continue; if(L.si>=it.lock||it.ghost) tag(it.label,b.x+b.w/2,it.ghost?b.y+b.h-6:b.y+b.h+12); }
  if(G.flash&&ready(G.flash.img)){ const f=G.flash, a=f.t<.15?f.t/.15:f.t>.6?Math.max(0,1-(f.t-.6)/.3):1; spr(f.img,f.x,f.y-f.t*10,f.w,{alpha:a}); }
  (G.fly||[]).forEach(f=>{ const e=Math.min(1,f.t/.6); spr(f.img,lerp(f.x0,f.x1,e),lerp(f.y0,f.y1,e)-Math.sin(e*Math.PI)*90,f.w*(1.3-.3*e),{rot:e*2}); });
  stepOver(L); drawParts();
  ctx.restore();
  if(!G.card){ if(!(L.hideUI&&L.hideUI(L))){ drawHUD(L); drawBubble(L); } drawToasts(L); }
}
function render(){
  G.btns=[]; ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  if(G.scene==='loading') drawLoading();
  else if(G.scene==='title') drawTitle();
  else if(G.scene==='final') drawFinal();
  else if(G.scene==='info'){ full('final'); drawInfo(G.level); }
  else { drawPlay(); if(G.card){ G.btns=[]; if(G.card.type==='intro') drawIntro(G.level); else if(G.card.type==='info') drawInfo(G.level); else drawDone(G.level); } drawNav(); }
  if(G.modal) drawModal();
  drawParts && G.scene!=='play' && drawParts();
  drawCursor(G.scene==='play'?G.level:null);
  if(G.scene!=='loading') drawSound();
}
let last=performance.now();
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; G.t+=dt; update(dt); render(); updateLoops(); requestAnimationFrame(loop); }
G.fontsOK=false; const fok=()=>{ G.fontsOK=true; };
if(document.fonts&&document.fonts.load){ Promise.all([document.fonts.load('800 20px "Baloo 2"','Mì Quảng ơ ư'),document.fonts.load('700 20px "Baloo 2"','Đầu bếp')]).then(fok,fok); setTimeout(fok,2500); } else fok();
requestAnimationFrame(loop);
window.__G=G; window.__start=startLevel;
})();
